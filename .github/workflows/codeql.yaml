# ---------------------------------------------------------------------------
# Analyse de code
# ---------------------------------------------------------------------------
# **CodeQL ne sait pas lire PHP**, et il ne faut pas croire le contraire : le
# cœur de Focusyn n'est pas couvert ici. Ce sont PHPStan, deptrac et la suite
# de tests qui tiennent ce rôle, dans `qa`.
#
# Restent deux surfaces que rien d'autre ne regarde :
#   - `actions` — les workflows eux-mêmes, où une interpolation `${{ }}` dans un
#     `run:` suffit à faire exécuter le titre d'une issue avec les droits du
#     dépôt ;
#   - `javascript-typescript` — les contrôleurs Stimulus et l'éditeur.
#
# La tâche ne s'exécute que là où l'analyse de code est disponible : gratuite en
# public, incluse dans GitHub Advanced Security en privé. C'est Terraform qui
# renseigne la variable, parce qu'un workflow ne peut pas connaître l'offre
# souscrite — et qu'un échec rouge permanent finit par être ignoré, puis
# désactivé avec le reste.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Une passe hebdomadaire : la base de règles évolue sans que le code bouge.
    - cron: '17 4 * * 1'

permissions: {}

jobs:
  analyse:
    name: CodeQL (${{ matrix.language }})
    if: vars.CODE_SCANNING == 'enabled'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          category: /language:${{ matrix.language }}
