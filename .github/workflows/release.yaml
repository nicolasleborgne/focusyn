# ---------------------------------------------------------------------------
# Publication d'une version
# ---------------------------------------------------------------------------
# **Une fusion sur `main` peut publier une version.** Pas toutes : c'est la
# nature des commits qui décide — `feat` monte le mineur, `fix` le correctif,
# `chore` et `docs` ne publient rien. Personne ne pose de tag à la main ; c'est
# l'usine qui les pose, ce que la convention du poste demandait déjà.
#
# **Tout tient dans une seule exécution, et il le faut** : un tag créé avec le
# `GITHUB_TOKEN` ne déclenche aucun workflow — GitHub s'en protège pour éviter
# les boucles. Enchaîner « semantic-release pose le tag → un second workflow
# construit » s'arrêterait donc en silence, à moins d'un jeton d'application à
# demeure, c'est-à-dire le secret de longue durée que cette chaîne évite.
#
# L'ordre, lui, ne change pas : on calcule, on construit, on éprouve, **puis**
# on annonce. Le tag et la release n'existent qu'une fois l'image poussée et
# attestée — une version annoncée sans artefact vérifiable serait pire qu'une
# version en retard.
#
# **Ce fichier ne construit rien.** La construction et la signature ont lieu
# dans un dépôt séparé, dont aucune étape n'est définie ici : c'est ce qui met
# le jeton de signature hors de portée du projet, et c'est la seule différence
# entre le niveau 2 et le niveau 3 de SLSA.
#
#   gh attestation verify oci://ghcr.io/nicolasleborgne/focusyn:0.2.0 \
#     --repo nicolasleborgne/focusyn \
#     --signer-repo nicolasleborgne/focusyn-builder \
#     --predicate-type https://slsa.dev/provenance/v1

name: Release

on:
  push:
    branches: [main]

# Rien par défaut. Chaque tâche redemande, nommément, ce dont elle a besoin.
permissions: {}

jobs:
  version:
    name: Y a-t-il une version à publier ?
    runs-on: ubuntu-latest
    # `write` pour une tâche qui n'écrit rien : semantic-release vérifie qu'il
    # *pourrait* poser le tag, même à blanc, et refuse de continuer sinon. La
    # portée reste étroite — le ruleset interdit toute poussée directe sur
    # `main`, y compris à ce jeton : il ne peut créer qu'un tag, et seulement
    # dans la tâche suivante.
    permissions:
      contents: write
    outputs:
      publier: ${{ steps.calcul.outputs.publier }}
      version: ${{ steps.calcul.outputs.version }}
    steps:
      # Tout l'historique et tous les tags : semantic-release compare le dernier
      # tag à ce qui a été fusionné depuis. Sans eux, il croirait à une première
      # version à chaque fois.
      #
      # jeton nécessaire : c'est par git, et non par l'API, que semantic-release
      # pousse le tag — il lui faut donc les identifiants dans `.git/config`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` et non `npx` : la version de l'outil vient du fichier de
      # verrouillage, que Dependabot suit et que grype analyse. Un `npx`
      # téléchargerait ce que npm voudra bien servir ce jour-là.
      - run: npm ci

      # À blanc : rien n'est créé, on veut seulement savoir s'il y a lieu, et
      # quel numéro. Le greffon `exec` écrit la réponse dans les sorties de
      # l'étape plutôt que de nous faire relire un journal.
      - name: Calculer la version
        id: calcul
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --dry-run

      - name: Dire ce qui a été décidé
        env:
          PUBLIER: ${{ steps.calcul.outputs.publier }}
          VERSION: ${{ steps.calcul.outputs.version }}
        run: |
          if [ "$PUBLIER" = "oui" ]; then
            echo "Version à publier : $VERSION"
          else
            echo "Rien à publier : aucun commit ne le justifie depuis le dernier tag."
          fi

  image:
    name: Image, SBOM et provenance
    needs: [version]
    if: needs.version.outputs.publier == 'oui'

    # Les droits se déclarent au point d'appel ; les étapes viennent toutes du
    # constructeur, dont ce dépôt ne définit rien.
    permissions:
      contents: read
      packages: write # pousser sur GHCR
      id-token: write # obtenir un jeton OIDC, donc signer sans clé
      attestations: write # déposer provenance et SBOM

    uses: nicolasleborgne/focusyn-builder/.github/workflows/build-image.yaml@2dbaa33dd72b137a0a359666e81eed45354a00d6 # builder-v5
    with:
      target: prod
      version: ${{ needs.version.outputs.version }}

  publication:
    name: Tag et release
    runs-on: ubuntu-latest
    needs: [version, image]
    permissions:
      contents: write # poser le tag et créer la release
      attestations: read # relire ce que le constructeur a signé
    steps:
      # jeton nécessaire : même raison que plus haut — c'est ici que le tag est
      # réellement poussé.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom

      # La commande exacte que promettent les notes, exécutée avant de les
      # écrire. C'est le seul maillon où l'on ferait sinon confiance à un
      # transfert d'artefact plutôt qu'à une signature — et `--signer-repo` est
      # la moitié qui compte : elle exige que la signature vienne du
      # constructeur, pas de ce dépôt-ci.
      - name: Relire les attestations avant d'annoncer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          for type in https://slsa.dev/provenance/v1 https://spdx.dev/Document; do
            gh attestation verify "oci://${IMAGE}@${DIGEST}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-repo "${GITHUB_REPOSITORY_OWNER}/focusyn-builder" \
              --predicate-type "$type"
          done

      # C'est ici, et seulement ici, que le tag naît — après que l'image existe,
      # a été éprouvée et attestée.
      - name: Poser le tag et publier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # Les notes de semantic-release disent ce qui a changé ; celles-ci disent
      # comment se passer de notre parole. C'est le seul endroit que lira
      # quelqu'un qui récupère l'image sans nous connaître.
      - name: Joindre l'image et sa vérification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release view "v${VERSION}" --json body --jq .body > notes.md
          cat >> notes.md <<TXT

          ## Image

          \`${IMAGE}:${VERSION}\`
          \`${DIGEST}\`

          ## Vérifier sans nous croire

          \`\`\`bash
          gh attestation verify oci://${IMAGE}@${DIGEST} \\
            --repo ${GITHUB_REPOSITORY} \\
            --signer-repo ${GITHUB_REPOSITORY_OWNER}/focusyn-builder \\
            --predicate-type https://slsa.dev/provenance/v1
          \`\`\`

          \`--signer-repo\` est l'assertion qui compte : elle exige que la
          signature vienne du constructeur, un dépôt séparé dont ce dépôt-ci ne
          définit aucune étape.
          TXT

          gh release edit "v${VERSION}" --notes-file notes.md
          gh release upload "v${VERSION}" sbom.spdx.json --clobber
