# ---------------------------------------------------------------------------
# Revue de dépendances
# ---------------------------------------------------------------------------
# `composer audit` et grype disent l'état du dépôt ; celle-ci dit ce qu'une
# demande *ajoute*. La différence compte : une faille déjà là se corrige quand
# on peut, une faille qu'on introduit se refuse tout de suite, avant qu'elle ne
# devienne « historique ».
#
# Elle regarde aussi les licences — une dépendance en GPL dans un produit
# propriétaire se remarque mieux au moment où on l'ajoute qu'au moment où on la
# vend.

name: Revue des dépendances

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  revue:
    name: Revue des dépendances
    if: vars.CODE_SCANNING == 'enabled'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0
