# ---------------------------------------------------------------------------
# OpenSSF Scorecard
# ---------------------------------------------------------------------------
# Note la posture du dépôt sur les critères que cette configuration prétend
# tenir : actions épinglées, branches protégées, dépendances à jour, workflows
# aux droits minimaux, présence d'un SBOM et d'une politique de divulgation.
#
# Son intérêt n'est pas la note mais l'écart : c'est un regard extérieur sur ce
# que l'on croit avoir fait. Une règle désactivée « cinq minutes » se voit ici
# dès la passe suivante.
#
# La tâche ne tourne que là où l'analyse de code peut recevoir ses résultats.

name: Scorecard

on:
  # Un changement de protection de branche est exactement ce que cet outil sait
  # juger : il vaut mieux l'apprendre le jour même.
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 2'

permissions: {}

jobs:
  analyse:
    name: Scorecard
    if: vars.CODE_SCANNING == 'enabled'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      # Pour signer et publier le résultat auprès d'OpenSSF, sans clé.
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # La publication n'a de sens — et n'est possible — que sur un dépôt
          # public : elle alimente un registre ouvert.
          publish_results: ${{ github.event.repository.visibility == 'public' }}

      - uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: scorecard.sarif
