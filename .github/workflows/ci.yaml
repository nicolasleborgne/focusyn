name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aucun droit par défaut : chaque tâche redemande ce dont elle a besoin, et
# aucune n'a besoin d'écrire. Le réglage du dépôt (`default_workflow_permissions`)
# irait dans le même sens, mais il n'est pas exposé par le fournisseur Terraform
# et se change d'un clic sans laisser de trace — c'est donc ici que la règle est
# écrite, au plus près, et c'est ici qu'elle se relit. L'étape « Analyse des
# workflows » refuse un workflow qui n'en déclarerait pas.
permissions: {}

env:
  PHP_VERSION: '8.4'

# Les actions sont épinglées par **empreinte de commit**, avec l'étiquette en
# commentaire. Une étiquette se déplace : `@v4` désigne ce que son auteur y a
# poussé ce matin, et un dépôt compromis livrerait son code dans nos exécutions,
# avec accès au jeton de l'exécution. Une empreinte ne se déplace pas.
#
# Pour en relever une :
#   gh api repos/<dépôt>/tags --jq '.[] | select(.name=="<version>") | .commit.sha'
#
# L'étiquette du commentaire est **précise** (`v4.4.0`, pas `v4`) : les
# analyseurs de composition lisent ce commentaire faute de pouvoir dater une
# empreinte, et une majeure nue leur fait signaler des failles corrigées depuis
# longtemps — un faux positif permanent, c'est-à-dire une alerte qu'on cesse de
# lire.

jobs:
  quality:
    name: Qualité (style, analyse statique, architecture)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: intl, pdo_pgsql, zip, sodium, apcu
          coverage: none
          tools: composer:v2
          # Le runner tourne en UTC ; devenv et l'image de production posent
          # tous deux Europe/Paris. Sans cette ligne, la CI éprouve une
          # configuration que personne n'exécute — et le rendu iCal, qui lit le
          # fuseau par défaut de PHP, décale d'une heure en hiver.
          ini-values: date.timezone=Europe/Paris

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Valider composer.json
        run: composer validate --strict --no-check-publish

      - name: Vulnérabilités connues des dépendances
        run: composer audit

      - name: Style de code
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      # PHPStan lit le conteneur compilé pour typer les services Symfony.
      - name: Préchauffer le conteneur
        run: php bin/console cache:warmup --env=dev
        env:
          DATABASE_URL: postgresql://focusyn:focusyn@127.0.0.1:5432/focusyn?serverVersion=17&charset=utf8

      - name: Analyse statique
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Couches de la clean architecture
        run: vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress

      - name: Étanchéité des contextes bornés
        run: vendor/bin/deptrac analyse --config-file=deptrac.contexts.yaml --no-progress

      # Les workflows s'exécutent avec les droits du dépôt : ils méritent la
      # même analyse statique que le reste. actionlint relit aussi les blocs
      # `run:` avec shellcheck — une variable non protégée dans un script de CI
      # est une injection comme une autre.
      - name: Analyse des workflows
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12 -color

      # actionlint ne juge pas les droits. Ces deux règles-là sont les nôtres,
      # et une règle qu'on énonce sans la vérifier finit par être fausse : c'est
      # exactement ce qui était arrivé à ce fichier, qui ne déclarait aucun
      # `permissions` pendant que `terraform/github/actions.tf` affirmait le
      # contraire.
      #
      # Les motifs sont ancrés en début de ligne : sans cela, ce script se
      # compterait lui-même, et un commentaire citant la règle la ferait
      # échouer. Un workflow réutilisable est exempté du premier contrôle — il
      # ne peut pas déclarer ses droits, il les reçoit de son appelant.
      - name: Droits déclarés et jeton non persisté
        run: |
          manque=0
          for f in .github/workflows/*.yaml builder/.github/workflows/*.yaml; do
            if grep -qE '^on:|^  workflow_call:' "$f" && ! grep -qE '^  workflow_call:' "$f"; then
              grep -qE '^permissions:' "$f" \
                || { echo "::error file=$f::aucun bloc permissions: au niveau du workflow"; manque=1; }
            fi

            checkouts=$(grep -cE '^ *- uses: actions/checkout@' "$f" || true)
            sansjeton=$(grep -cE '^ *persist-credentials: false$' "$f" || true)
            if [ "$checkouts" != "$sansjeton" ]; then
              echo "::error file=$f::$checkouts checkout(s) pour $sansjeton persist-credentials: false"
              manque=1
            fi
          done
          [ "$manque" = 0 ] && echo "Droits déclarés partout, aucun jeton laissé dans .git/config."
          exit "$manque"

  tests:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, functional]
    services:
      database:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: focusyn
          POSTGRES_USER: focusyn
          POSTGRES_PASSWORD: focusyn
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U focusyn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://focusyn:focusyn@127.0.0.1:5432/focusyn?serverVersion=17&charset=utf8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: intl, pdo_pgsql, zip, sodium, apcu
          coverage: none
          tools: composer:v2
          # Le runner tourne en UTC ; devenv et l'image de production posent
          # tous deux Europe/Paris. Sans cette ligne, la CI éprouve une
          # configuration que personne n'exécute — et le rendu iCal, qui lit le
          # fuseau par défaut de PHP, décale d'une heure en hiver.
          ini-values: date.timezone=Europe/Paris

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Préparer le schéma de test
        if: matrix.suite != 'unit'
        run: |
          php bin/console --env=test doctrine:database:create --if-not-exists
          php bin/console --env=test doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: PHPUnit
        run: vendor/bin/phpunit --testsuite=${{ matrix.suite }}

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [quality, tests]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Construire l'image de production
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: prod
          push: false
          load: true
          tags: focusyn:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vérifier que l'image démarre
        run: |
          docker run --rm -e APP_ENV=prod -e APP_SECRET=ci -e DATABASE_URL='postgresql://x:x@127.0.0.1:5432/x?serverVersion=17' \
            focusyn:${{ github.sha }} php bin/console --version

      # L'inventaire de ce qui est réellement dans l'image : paquets Alpine,
      # extensions PHP, modules Go compilés dans FrankenPHP, dépendances
      # Composer. `composer.lock` ne dit rien des trois premiers.
      - name: Inventaire de l'image (syft)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:v1.51.1 focusyn:${{ github.sha }} \
            -o cyclonedx-json > sbom-image.cyclonedx.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:v1.51.1 focusyn:${{ github.sha }} -o table

      # Le seuil est « critique », et non « élevé », pour une raison précise :
      # FrankenPHP 1.12 embarque `google.golang.org/grpc` 1.81, sur lequel
      # pèsent trois avis de niveau élevé qu'aucune reconstruction ne corrige —
      # il faut que l'amont bouge. Bloquer dessus rendrait la CI rouge en
      # permanence, c'est-à-dire illisible. `--only-fixed` écarte de même ce
      # qu'aucune version ne répare encore : on ne s'arrête que sur ce qui
      # peut être réparé, l'inventaire complet restant joint à l'exécution.
      - name: Vulnérabilités de l'image (grype)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/grype:v0.118.0 focusyn:${{ github.sha }} \
            --only-fixed --fail-on critical -o table

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom-image
          path: sbom-image.cyclonedx.json

  infrastructure:
    name: Dépôt (terraform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # La politique du dépôt est du code, et se relit comme tel. Sans ce
      # contrôle, une règle mal écrite ne se découvre qu'au prochain `apply` —
      # c'est-à-dire le jour où l'on croit l'avoir appliquée.
      #
      # `validate` n'a besoin d'aucune identité : il vérifie le schéma du
      # fournisseur, pas l'état du dépôt distant. Aucun jeton n'entre ici.
      # `builder/` est une copie du dépôt constructeur, et une copie dérive.
      # Rien ne la reliait mécaniquement à l'empreinte que `release.yaml`
      # épingle : on pouvait donc relire ici un constructeur qui n'est pas
      # celui qui signe. Le dépôt est public, la comparaison ne coûte rien.
      - name: builder/ est bien le constructeur épinglé
        run: |
          sha=$(grep -oE 'focusyn-builder/\.github/workflows/build-image\.yaml@[0-9a-f]{40}' \
                  .github/workflows/release.yaml | cut -d@ -f2)
          [ -n "$sha" ] || { echo "::error::aucune empreinte de constructeur dans release.yaml"; exit 1; }
          git clone -q --filter=blob:none https://github.com/nicolasleborgne/focusyn-builder.git "$RUNNER_TEMP/b"
          git -C "$RUNNER_TEMP/b" checkout -q "$sha"
          if ! diff -r --exclude=.git builder "$RUNNER_TEMP/b"; then
            echo "::error::builder/ diffère du constructeur épinglé ($sha)"
            exit 1
          fi
          echo "builder/ correspond à $sha."

      - name: Forme et validité
        run: |
          docker run --rm -v "$PWD/terraform/github:/tf" -w /tf \
            ghcr.io/opentofu/opentofu:1.12.6 fmt -check -recursive -diff
          docker run --rm -v "$PWD/terraform/github:/tf" -w /tf \
            ghcr.io/opentofu/opentofu:1.12.6 init -backend=false -input=false
          docker run --rm -v "$PWD/terraform/github:/tf" -w /tf \
            ghcr.io/opentofu/opentofu:1.12.6 validate

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tout l'historique : un secret retiré depuis reste lisible dans le
          # commit qui l'a introduit, et c'est celui-là qu'il faut révoquer.
          fetch-depth: 0
          persist-credentials: false

      # `--redact` : le journal d'exécution d'une CI est lisible par qui a
      # accès au dépôt, et republier le secret trouvé serait le divulguer une
      # seconde fois. L'emplacement suffit à le retrouver.
      - name: Recherche de secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  dependances:
    name: Dépendances (syft, grype)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Les fichiers de verrouillage suffisent : grype les lit sans qu'il soit
      # besoin d'installer quoi que ce soit. Deux angles complètent
      # `composer audit`, qui ne regarde que PHP — les dépendances npm de
      # l'outillage, et les actions GitHub employées par cette CI elle-même.
      - name: Inventaire du dépôt (syft)
        run: |
          docker run --rm -v "$PWD:/src:ro" anchore/syft:v1.51.1 dir:/src \
            --exclude './vendor/**/.github/**' --exclude './node_modules/**' \
            -o cyclonedx-json > sbom-depot.cyclonedx.json

      - name: Vulnérabilités des dépendances (grype)
        run: |
          docker run --rm -v "$PWD:/src:ro" anchore/grype:v0.118.0 dir:/src \
            --exclude './vendor/**/.github/**' --exclude './node_modules/**' \
            --fail-on medium -o table

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom-depot
          path: sbom-depot.cyclonedx.json
