when@dev: &dev
    zenstruck_foundry:
        persistence:
            # Un seul flush par appel à `create()`.
            flush_once: true

        orm:
            # La base de test est reconstruite **par les migrations**, et non
            # depuis le mapping. Deux raisons :
            #   - le mode SCHEMA supprime `doctrine_migration_versions`, ce qui
            #     casse toute migration lancée ensuite sur cette base ;
            #   - rejouer les migrations à chaque exécution les met réellement à
            #     l'épreuve, au lieu de ne vérifier que le mapping.
            reset:
                mode: !php/enum Zenstruck\Foundry\ORM\ResetDatabase\ResetDatabaseMode::MIGRATE

when@test: *dev
