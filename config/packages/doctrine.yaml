doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '17'
        charset: utf8
        profiling_collect_backtrace: '%kernel.debug%'

        # Types portant les objets valeur du domaine jusqu'à la base.
        # Les identifiants sont stockés en `uuid` natif PostgreSQL : deux fois
        # moins d'octets qu'une chaîne de 36 caractères, et comparaison plus
        # rapide sur les clés primaires et étrangères.
        types:
            user_id: App\Identity\Infrastructure\Persistence\Doctrine\Type\UserIdType
            email_address: App\Identity\Infrastructure\Persistence\Doctrine\Type\EmailAddressType
            hashed_password: App\Identity\Infrastructure\Persistence\Doctrine\Type\HashedPasswordType
            totp_secret: App\Identity\Infrastructure\Persistence\Doctrine\Type\TotpSecretType
            display_preferences: App\Identity\Infrastructure\Persistence\Doctrine\Type\DisplayPreferencesType
            oauth_identity_id: App\Identity\Infrastructure\Persistence\Doctrine\Type\OAuthIdentityIdType
            device: App\Identity\Infrastructure\Persistence\Doctrine\Type\DeviceType
            subscription_id: App\Billing\Infrastructure\Persistence\Doctrine\Type\SubscriptionIdType
            tenant_id: App\Shared\Infrastructure\Persistence\Doctrine\Type\TenantIdType
            subject_id: App\Privacy\Infrastructure\Persistence\Doctrine\Type\SubjectIdType
            note_id: App\Notebook\Infrastructure\Persistence\Doctrine\Type\NoteIdType
            author_id: App\Notebook\Infrastructure\Persistence\Doctrine\Type\AuthorIdType
            note_title: App\Notebook\Infrastructure\Persistence\Doctrine\Type\NoteTitleType
            note_body: App\Notebook\Infrastructure\Persistence\Doctrine\Type\NoteBodyType
            obsession_name: App\Notebook\Infrastructure\Persistence\Doctrine\Type\ObsessionNameType
            obsession_id: App\Notebook\Infrastructure\Persistence\Doctrine\Type\ObsessionIdType
            obsession_blurb: App\Notebook\Infrastructure\Persistence\Doctrine\Type\ObsessionBlurbType
            obsession_points: App\Notebook\Infrastructure\Persistence\Doctrine\Type\ObsessionPointsType
            task_list_id: App\Task\Infrastructure\Persistence\Doctrine\Type\TaskListIdType
            task_item_id: App\Task\Infrastructure\Persistence\Doctrine\Type\TaskItemIdType
            task_list_name: App\Task\Infrastructure\Persistence\Doctrine\Type\TaskListNameType
            task_text: App\Task\Infrastructure\Persistence\Doctrine\Type\TaskTextType
            assistant_owner_id: App\Assistant\Infrastructure\Persistence\Doctrine\Type\OwnerIdType
            assistant_provider: App\Assistant\Infrastructure\Persistence\Doctrine\Type\ProviderType
            sealed_key: App\Assistant\Infrastructure\Persistence\Doctrine\Type\SealedKeyType
            push_subscription_id: App\Reminder\Infrastructure\Persistence\Doctrine\Type\PushSubscriptionIdType
            push_endpoint: App\Reminder\Infrastructure\Persistence\Doctrine\Type\PushEndpointType
            push_keys: App\Reminder\Infrastructure\Persistence\Doctrine\Type\PushKeysType
            calendar_feed_id: App\Reminder\Infrastructure\Persistence\Doctrine\Type\CalendarFeedIdType
            feed_token: App\Reminder\Infrastructure\Persistence\Doctrine\Type\FeedTokenType
            recipient_id: App\Reminder\Infrastructure\Persistence\Doctrine\Type\RecipientIdType
            reminder_id: App\Reminder\Infrastructure\Persistence\Doctrine\Type\ReminderIdType
            reminder_subject: App\Reminder\Infrastructure\Persistence\Doctrine\Type\ReminderSubjectType
            reminder_label: App\Reminder\Infrastructure\Persistence\Doctrine\Type\ReminderLabelType
            organization_id: App\Organization\Infrastructure\Persistence\Doctrine\Type\OrganizationIdType
            invitation_id: App\Organization\Infrastructure\Persistence\Doctrine\Type\InvitationIdType
            invited_email: App\Organization\Infrastructure\Persistence\Doctrine\Type\InvitedEmailType
            invitation_token: App\Organization\Infrastructure\Persistence\Doctrine\Type\InvitationTokenType
            membership_id: App\Organization\Infrastructure\Persistence\Doctrine\Type\MembershipIdType
            member_id: App\Organization\Infrastructure\Persistence\Doctrine\Type\MemberIdType

    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity

        # Pas de découverte automatique : chaque contexte déclare explicitement son
        # mapping. Le type est TOUJOURS `xml` — les agrégats du domaine ne portent
        # aucun attribut Doctrine, la correspondance objet/table vit dans
        # l'infrastructure du contexte concerné.
        # Désactivé par défaut : les commandes console et les workers
        # travaillent hors de toute organisation. En contexte HTTP, un écouteur
        # l'active systématiquement (voir EnableTenantFilterListener).
        filters:
            tenant:
                class: App\Shared\Infrastructure\Persistence\Doctrine\Filter\TenantFilter
                enabled: false

        auto_mapping: false
        mappings:
            Identity:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Identity\Domain\Model'
                alias: Identity
            Organization:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Organization/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Organization\Domain\Model'
                alias: Organization
            Notebook:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Notebook/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Notebook\Domain\Model'
                alias: Notebook
            Task:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Task/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Task\Domain\Model'
                alias: Task
            Reminder:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Reminder/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Reminder\Domain\Model'
                alias: Reminder
            Assistant:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Assistant/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Assistant\Domain\Model'
                alias: Assistant
            Billing:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Billing/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Billing\Domain\Model'
                alias: Billing
            Privacy:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Privacy/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Privacy\Domain\Model'
                alias: Privacy

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" est renseigné par ParaTest lors des exécutions parallèles.
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
