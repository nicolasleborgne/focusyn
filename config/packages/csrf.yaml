# Enable stateless CSRF protection for forms and logins/logouts
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        stateless_token_ids:
            - submit
            - authenticate
            - logout
            # Sans session : l'écran est public, et un jeton en session y
            # ouvrirait une session en base pour chaque visiteur anonyme.
            - password-request
