security:
    password_hashers:
        App\Identity\Infrastructure\Security\SecurityUser: 'auto'

    providers:
        focusyn:
            id: App\Identity\Infrastructure\Security\DomainUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: focusyn

            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                default_target_path: home
                username_parameter: 'login[email]'
                password_parameter: 'login[password]'

            logout:
                path: logout
                target: login

            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            # Second facteur : le mot de passe ouvre une session « en cours
            # d'authentification », qui ne donne accès à rien tant que le code
            # n'est pas fourni.
            custom_authenticators:
                - App\Identity\Infrastructure\Security\OAuthAuthenticator

            two_factor:
                auth_form_path: two_factor_login
                check_path: two_factor_login_check
                auth_code_parameter_name: _auth_code
                trusted_parameter_name: _trusted

    access_control:
        # La sonde de disponibilité et la page hors ligne restent joignables :
        # Docker interroge la première, le service worker met la seconde en cache.
        - { path: '^/(healthz|offline)$', roles: PUBLIC_ACCESS }
        - { path: '^/(connexion|login|inscription|register)$', roles: PUBLIC_ACCESS }
        - { path: '^/(connexion|login)/(google|github)', roles: PUBLIC_ACCESS }
        # L'écran du second facteur n'est atteignable qu'entre les deux étapes.
        - { path: '^/(double-authentification|two-factor)', roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        firewalls:
            main:
                # La limitation des tentatives compte dans un cache qui survit
                # d'une exécution à l'autre : au bout de quelques passages, les
                # tests de connexion se mettaient à échouer sans raison
                # apparente. Le comportement lui-même reste actif en dev et en
                # production ; le vérifier demanderait une horloge maîtrisée.
                login_throttling:
                    max_attempts: 1000

        password_hashers:
            # Le hachage réel coûte des centaines de millisecondes par test.
            App\Identity\Infrastructure\Security\SecurityUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
