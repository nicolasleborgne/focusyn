# Les portées demandées à chaque fournisseur sont posées à l'appel
# (voir StartOAuthController) : le bundle ne les expose pas en configuration
# pour ces deux clients.
knpu_oauth2_client:
    clients:
        google:
            type: google
            client_id: '%env(OAUTH_GOOGLE_ID)%'
            client_secret: '%env(OAUTH_GOOGLE_SECRET)%'
            redirect_route: oauth_check
            redirect_params: { provider: google }

        github:
            type: github
            client_id: '%env(OAUTH_GITHUB_ID)%'
            client_secret: '%env(OAUTH_GITHUB_SECRET)%'
            redirect_route: oauth_check
            redirect_params: { provider: github }
