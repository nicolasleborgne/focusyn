framework:
    messenger:
        failure_transport: failed

        # Deux bus aux responsabilités distinctes :
        #   command.bus  une intention, un seul gestionnaire, une transaction ;
        #   event.bus    un fait acquis, zéro à N gestionnaires — d'où
        #                `allow_no_handlers` : publier un événement que personne
        #                n'écoute encore est normal, pas une erreur.
        default_bus: command.bus
        buses:
            command.bus:
                middleware:
                    - doctrine_transaction
            event.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true

        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Les événements de domaine restent synchrones : ils font partie de
            # la même unité de travail que la commande qui les a provoqués.
            # Ce qui doit vraiment attendre (courriels, notifications) sera
            # routé explicitement vers `async`.

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
