# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Toutes les classes de src/ sont candidates au conteneur, SAUF le domaine :
    # les agrégats, objets valeur et interfaces de dépôt sont du PHP pur, construits
    # par le code métier et jamais injectés. Cette exclusion est la première ligne de
    # défense de la clean architecture — elle est doublée par deptrac.
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Domain/'

    # ---------------------------------------------------------------------
    # Ports → adaptateurs
    # ---------------------------------------------------------------------
    # Déclarés explicitement plutôt que laissés à la déduction automatique :
    # le jour où un port aura deux implémentations, l'arbitrage sera ici, visible,
    # et non dans un message d'erreur d'autowiring.
    App\Identity\Domain\Repository\UserRepository:
        alias: App\Identity\Infrastructure\Persistence\Doctrine\DoctrineUserRepository
        public: true

    App\Organization\Domain\Repository\OrganizationRepository:
        alias: App\Organization\Infrastructure\Persistence\Doctrine\DoctrineOrganizationRepository
        public: true

    App\Shared\Application\Event\DomainEventBus:
        alias: App\Shared\Infrastructure\Messenger\MessengerDomainEventBus

    App\Identity\Application\Port\PasswordHasher:
        alias: App\Identity\Infrastructure\Security\SymfonyPasswordHasher

    App\Shared\Application\Command\CommandBus:
        alias: App\Shared\Infrastructure\Messenger\MessengerCommandBus
        public: true

    App\Organization\Application\Port\SlugGenerator:
        alias: App\Organization\Infrastructure\Slug\AsciiSlugGenerator

    App\Shared\Application\Account\CurrentAccount:
        alias: App\Identity\Infrastructure\Security\SecurityCurrentAccount

    App\Identity\Application\Port\SessionStarter:
        alias: App\Identity\Infrastructure\Security\SecuritySessionStarter

    App\Identity\Application\Port\BackupCodeHasher:
        alias: App\Identity\Infrastructure\Security\SymfonyBackupCodeHasher

    App\Identity\Application\Port\BackupCodeGenerator:
        alias: App\Identity\Infrastructure\Security\ReadableBackupCodeGenerator

    App\Identity\Application\Port\TotpProvisioner:
        alias: App\Identity\Infrastructure\Security\SchebTotpProvisioner

    # Remplace le gestionnaire par défaut, qui suppose des codes en clair.
    scheb_two_factor.security.backup_code_manager:
        alias: App\Identity\Infrastructure\Security\HashedBackupCodeManager

    App\Identity\Application\Port\AvailableOAuthProviders:
        alias: App\Identity\Infrastructure\Security\OAuth\ConfiguredOAuthProviders

    App\Shared\Application\Tenant\CurrentTenant:
        alias: App\Organization\Infrastructure\Tenant\MembershipCurrentTenant
        public: true

    App\Notebook\Domain\Repository\NoteRepository:
        alias: App\Notebook\Infrastructure\Persistence\Doctrine\DoctrineNoteRepository
        public: true

    App\Routine\Domain\Repository\RoutineRepository:
        alias: App\Routine\Infrastructure\Persistence\Doctrine\DoctrineRoutineRepository
        public: true

    App\Inbox\Domain\Repository\CaptureRepository:
        alias: App\Inbox\Infrastructure\Persistence\Doctrine\DoctrineCaptureRepository
        public: true

    # La boîte trie, elle ne sait pas ce qu'est une note ni une liste de tâches :
    # chaque contexte fournit l'écriture, par un port qui ne passe que des
    # primitives.
    App\Shared\Application\Notebook\NoteWriter:
        alias: App\Notebook\Infrastructure\Inbox\HandlerNoteWriter

    App\Shared\Application\Search\RoutineFinder:
        alias: App\Routine\Infrastructure\Search\RoutineStepFinder

    App\Shared\Application\Reminder\ReminderScheduler:
        alias: App\Reminder\Infrastructure\Review\CommandReminderScheduler

    App\Shared\Application\Assistant\WritingAssistant:
        alias: App\Assistant\Infrastructure\Notebook\PortableWritingAssistant

    App\Shared\Application\Notebook\ObsessionDirectory:
        alias: App\Notebook\Infrastructure\Routine\NoteObsessionDirectory

    App\Shared\Application\Task\TaskWriter:
        alias: App\Task\Infrastructure\Inbox\HandlerTaskWriter

    App\Shared\Application\Shell\RoutineSummaryProvider:
        alias: App\Routine\Infrastructure\Shell\RoutineShellSummary

    App\Shared\Application\Shell\InboxSummaryProvider:
        alias: App\Inbox\Infrastructure\Shell\CaptureShellSummary

    App\Shared\Application\Shell\ShellDataProvider:
        alias: App\Shared\Infrastructure\Shell\AggregatedShellDataProvider

    App\Shared\Application\Shell\NotebookSummaryProvider:
        alias: App\Notebook\Infrastructure\Shell\NotebookShellSummary

    App\Task\Domain\Repository\TaskListRepository:
        alias: App\Task\Infrastructure\Persistence\Doctrine\DoctrineTaskListRepository
        public: true

    App\Shared\Application\Shell\TaskSummaryProvider:
        alias: App\Task\Infrastructure\Shell\TaskShellSummary

    App\Shared\Application\Tenant\TenantScope:
        alias: App\Shared\Infrastructure\Tenant\DoctrineTenantScope
        public: true

    App\Identity\Application\Port\PasswordResetLink:
        alias: App\Identity\Infrastructure\Security\SignedPasswordResetLink
        public: true

    App\Identity\Application\Port\PasswordResetMailer:
        alias: App\Identity\Infrastructure\Mail\SymfonyPasswordResetMailer

    App\Notebook\Domain\Repository\ObsessionRepository:
        alias: App\Notebook\Infrastructure\Persistence\Doctrine\DoctrineObsessionRepository
        public: true

    App\Shared\Application\Display\CurrentDisplay:
        alias: App\Identity\Infrastructure\Security\AccountDisplay
        public: true

    App\Privacy\Domain\Repository\PrivacyChoicesRepository:
        alias: App\Privacy\Infrastructure\Persistence\Doctrine\DoctrinePrivacyChoicesRepository
        public: true

    App\Reminder\Domain\Repository\ReminderRepository:
        alias: App\Reminder\Infrastructure\Persistence\Doctrine\DoctrineReminderRepository
        public: true

    App\Shared\Application\Account\AccountDirectory:
        alias: App\Identity\Infrastructure\Security\UserDirectory

    App\Reminder\Application\Port\ReminderNotifier:
        alias: App\Reminder\Application\Notification\NotifyEveryChannel

    App\Reminder\Application\Command\NotifyDueReminders\NotifyDueRemindersHandler:
        arguments:
            $defaultLocale: '%kernel.default_locale%'

    App\Reminder\Domain\Repository\CalendarFeedRepository:
        alias: App\Reminder\Infrastructure\Persistence\Doctrine\DoctrineCalendarFeedRepository
        public: true

    App\Reminder\Application\Port\FeedTokenGenerator:
        alias: App\Reminder\Infrastructure\Feed\RandomFeedTokenGenerator

    App\Reminder\Domain\Repository\PushSubscriptionRepository:
        alias: App\Reminder\Infrastructure\Persistence\Doctrine\DoctrinePushSubscriptionRepository
        public: true

    App\Reminder\Infrastructure\Push\WebPushChannel:
        arguments:
            $publicKey: '%env(VAPID_PUBLIC_KEY)%'
            $privateKey: '%env(VAPID_PRIVATE_KEY)%'
            $subject: '%env(VAPID_SUBJECT)%'

    App\Reminder\UI\TwigComponent\ReminderSection:
        arguments:
            $vapidPublicKey: '%env(VAPID_PUBLIC_KEY)%'

    App\Assistant\Domain\Repository\AssistantSettingsRepository:
        alias: App\Assistant\Infrastructure\Persistence\Doctrine\DoctrineAssistantSettingsRepository
        public: true

    App\Assistant\Application\Port\KeyVault:
        alias: App\Assistant\Infrastructure\Crypto\SodiumKeyVault

    App\Assistant\Infrastructure\Crypto\SodiumKeyVault:
        arguments:
            $secret: '%env(ASSISTANT_SECRET)%'

    App\Assistant\Application\Port\AllowedLocalAddresses:
        alias: App\Assistant\Infrastructure\Provider\ConfiguredLocalAddresses

    App\Shared\Application\Privacy\ConsentGate:
        alias: App\Privacy\Infrastructure\Consent\StoredConsentGate

    App\Shared\Application\Notebook\NoteSource:
        alias: App\Notebook\Infrastructure\Assistant\StoredNoteSource

    App\Shared\Application\Search\TaskFinder:
        alias: App\Task\Infrastructure\Search\TaskListFinder

    App\Identity\Domain\Repository\LoginSessionRepository:
        alias: App\Identity\Infrastructure\Persistence\Doctrine\DoctrineLoginSessionRepository
        public: true

    # Le gestionnaire de sessions en base. La table est créée par une migration
    # plutôt que par le gestionnaire lui-même : elle doit exister avant la
    # première requête, et se lire dans l'historique du schéma.
    session.handler.pdo:
        class: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        arguments:
            - '%env(DATABASE_URL)%'
            - { lock_mode: 1 }

    App\Identity\Application\Port\SessionCloser:
        alias: App\Identity\Infrastructure\Session\HandlerSessionCloser

    App\Identity\Infrastructure\Session\HandlerSessionCloser:
        arguments:
            $sessions: '@session.handler.pdo'

    App\Organization\Domain\Repository\InvitationRepository:
        alias: App\Organization\Infrastructure\Persistence\Doctrine\DoctrineInvitationRepository
        public: true

    App\Organization\Application\Port\InvitationTokenGenerator:
        alias: App\Organization\Infrastructure\Invitation\RandomInvitationTokenGenerator

    App\Organization\Application\Port\InvitationLink:
        alias: App\Organization\Infrastructure\Invitation\RoutedInvitationLink

    App\Organization\Application\Port\InvitationMailer:
        alias: App\Organization\Infrastructure\Mail\SymfonyInvitationMailer

    App\Organization\Application\Port\PreferredOrganization:
        alias: App\Organization\Infrastructure\Tenant\MembershipCurrentTenant

    App\Identity\Application\Port\EmailChangeLink:
        alias: App\Identity\Infrastructure\Security\SignedEmailChangeLink

    App\Identity\Application\Port\EmailChangeMailer:
        alias: App\Identity\Infrastructure\Mail\SymfonyEmailChangeMailer

    App\Organization\Application\Port\PendingInvitation:
        alias: App\Organization\Infrastructure\Invitation\SessionPendingInvitation

    App\Billing\Domain\Repository\SubscriptionRepository:
        alias: App\Billing\Infrastructure\Persistence\Doctrine\DoctrineSubscriptionRepository
        public: true

    App\Shared\Application\Billing\Entitlements:
        alias: App\Billing\Application\Query\CurrentEntitlements

    App\Billing\Application\Port\PaymentProvider:
        alias: App\Billing\Infrastructure\Payment\StripePaymentProvider

    App\Billing\Infrastructure\Payment\StripePaymentProvider:
        arguments:
            $secretKey: '%env(STRIPE_SECRET_KEY)%'
            $personalPrice: '%env(STRIPE_PRICE_PERSONAL)%'
            $teamPrice: '%env(STRIPE_PRICE_TEAM)%'

    App\Billing\UI\Http\StripeWebhookController:
        arguments:
            $webhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'
        tags: ['controller.service_arguments']

    App\Shared\Application\Notebook\NoteTally:
        alias: App\Notebook\Infrastructure\Billing\StoredNoteTally

    App\Shared\Application\Team\TeamSize:
        alias: App\Organization\Infrastructure\Billing\MembershipTeamSize

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # Le double du fournisseur passe devant les trois adaptateurs réels et
        # répond pour tous : aucun appel ne doit sortir de la machine parce
        # qu'une suite tourne. La priorité suffit — le registre retient le
        # premier qui dit savoir parler au fournisseur demandé.
        App\Tests\Double\Assistant\FakeCompletion:
            public: true
            tags: [{ name: 'app.chat_completion', priority: 100 }]

        # Le prestataire de paiement, simulé : aucune clé Stripe n'est
        # nécessaire pour vérifier ce qui nous appartient — le bouton, le
        # palier envoyé, le nombre de places.
        App\Tests\Double\Billing\FakePaymentProvider:
            public: true

        App\Billing\Application\Port\PaymentProvider:
            alias: App\Tests\Double\Billing\FakePaymentProvider
