privacy:
    heading: Données personnelles
    # Cette déclaration engage : elle doit décrire l'hébergement réel.
    statement: >-
        Vos notes et vos listes sont hébergées sur nos serveurs, en France, pour
        vous être accessibles depuis n'importe quel appareil. Nous ne les lisons
        pas, nous ne les revendons pas, et nous ne les transmettons à personne
        sans une obligation légale.
    consent:
        assistant: Assistant IA
        assistant_help: >-
            Autorise l'envoi du texte que vous sélectionnez au fournisseur d'IA
            que vous avez configuré. Rien n'est envoyé sans cette autorisation.
        usage: Mesure d'usage
        usage_help: >-
            Compte les pages consultées pour comprendre ce qui sert. Aucun
            traceur publicitaire, aucun partage avec un tiers.
        backup: Sauvegardes chiffrées
        backup_help: >-
            Conserve une copie chiffrée de votre carnet pour pouvoir le
            restaurer si vous perdez quelque chose.
    retention:
        label: Durée de conservation
        help: >-
            Au-delà de cette durée, les notes que vous avez supprimées sont
            purgées définitivement de nos sauvegardes.
        twelve_months: 12 mois
        twenty_four_months: 24 mois
        unlimited: Sans limite
    portability:
        label: Emporter vos données
        summary: >-
            {notes, plural, =0 {Aucune note} one {# note} other {# notes}} ·
            {lists, plural, =0 {aucune tâche} one {# tâche} other {# tâches}}
        json: Exporter en JSON
        markdown: Exporter en Markdown
    erasure:
        label: Effacer vos données
        help: >-
            Supprime définitivement vos notes et vos listes. Votre compte reste
            ouvert. Cette action est irréversible.
        armed: >-
            Un second envoi effacera vos notes et vos listes, sans retour
            possible.
        action: Effacer
        confirm: Confirmer l'effacement
    saved: Préférence enregistrée.
    erase_confirm: Cliquez une seconde fois pour confirmer l'effacement.
    erased: Vos notes et vos listes ont été effacées.

reminder:
    heading: Rappel
    chip: Rappel
    close: Fermer
    date: Date du rappel
    time: Heure du rappel
    save: Enregistrer le rappel
    ics: Ajouter au calendrier (.ics)
    drop: Supprimer le rappel
    help: >-
        Vous serez prévenu à l'heure dite, par courriel et — si vous les avez
        activées — par notification système. Le fichier .ics, lui, dépose
        l'événement dans votre agenda, qui prend alors le relais.
    shortcut:
        tonight: Ce soir 20 h
        tomorrow: Demain 9 h
        three_days: Dans 3 jours
        monday: Lundi 8 h
    saved: Rappel enregistré.
    dropped: Rappel supprimé.
    invalid: Ce moment n'a pas été compris.
    settings:
        heading: Rappels
    push:
        label: Notifications système
        on: Cet appareil reçoit les rappels, même Focusyn fermé.
        off: Cet appareil ne reçoit rien pour l'instant. Les rappels partent quand même par courriel.
        denied: Les notifications sont bloquées pour ce site. Cela se rouvre dans les réglages du navigateur.
        unsupported: Ce navigateur ne sait pas recevoir de notifications poussées.
        error: L'abonnement n'a pas pu être enregistré. Réessayez.
        enable: Activer sur cet appareil
        disable: Désactiver ici
    feed:
        label: Flux iCal
        help: >-
            Abonnez votre agenda à cette adresse : vos rappels y apparaissent et
            s'y mettent à jour tout seuls.
        absent: >-
            Ouvrez un flux pour retrouver vos rappels dans l'agenda de votre
            choix.
        secret: >-
            Cette adresse vaut mot de passe : qui l'a voit vos rappels. La
            renouveler coupe l'accès à tous les agendas déjà abonnés.
        open: Ouvrir un flux
        rotate: Renouveler l'adresse
        rotated: Nouvelle adresse de flux. Les agendas abonnés à l'ancienne ne reçoivent plus rien.
    email:
        subject: 'Rappel : {label}'
        intro: Vous aviez demandé qu'on vous le rappelle.
        open: Ouvrir Focusyn
