assistant:
    heading: Assistant
    # Cette phrase engage : elle décrit ce que le serveur fait de la clé.
    statement: >-
        Focusyn n'héberge aucun modèle. Vous branchez le fournisseur de votre
        choix avec votre propre clé : elle est chiffrée avant d'être conservée,
        n'apparaît ni dans les notes ni dans les exports, et ne vous est jamais
        réaffichée. Le serveur doit pouvoir la relire pour appeler le
        fournisseur en votre nom.
    needs_consent: >-
        L'assistant est éteint tant que vous n'y avez pas consenti, dans
        « Données personnelles » ci-dessous.
