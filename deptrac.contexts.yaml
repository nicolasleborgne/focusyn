# Étanchéité entre contextes bornés.
# Exécuter : vendor/bin/deptrac analyse --config-file=deptrac.contexts.yaml
#
# Un contexte ne connaît que lui-même, le noyau partagé, et les événements de
# domaine publiés par les autres.
#
# `Domain/Event/` est le contrat public d'un contexte : ce qu'il accepte de dire
# au reste du monde. Tout le reste — agrégats, dépôts, services — lui est privé.
# C'est pourquoi les dossiers d'événements sont extraits des couches de contexte
# et regroupés dans `PublishedEvents`, que chacun a le droit de lire.
deptrac:
    paths:
        - ./src
    layers:
        -   name: Shared
            collectors:
                -   type: bool
                    must:
                        -   type: directory
                            value: src/Shared/.*
                    must_not:
                        -   type: directory
                            value: src/[^/]+/Domain/Event/.*
                        -   type: classNameRegex
                            value: '#^App\\Shared\\UI\\Console\\SeedDemoDataCommand$#'
        -   name: Identity
            collectors:
                -   type: bool
                    must:
                        -   type: directory
                            value: src/Identity/.*
                    must_not:
                        -   type: directory
                            value: src/[^/]+/Domain/Event/.*
        -   name: Organization
            collectors:
                -   type: bool
                    must:
                        -   type: directory
                            value: src/Organization/.*
                    must_not:
                        -   type: directory
                            value: src/[^/]+/Domain/Event/.*
        -   name: Notebook
            collectors:
                -   type: bool
                    must:
                        -   type: directory
                            value: src/Notebook/.*
                    must_not:
                        -   type: directory
                            value: src/[^/]+/Domain/Event/.*
        -   name: Task
            collectors:
                -   type: bool
                    must:
                        -   type: directory
                            value: src/Task/.*
                    must_not:
                        -   type: directory
                            value: src/[^/]+/Domain/Event/.*
        -   name: Reminder
            collectors:
                -   type: bool
                    must:
                        -   type: directory
                            value: src/Reminder/.*
                    must_not:
                        -   type: directory
                            value: src/[^/]+/Domain/Event/.*
        -   name: Routine
            collectors:
                -   type: bool
                    must:
                        -   type: directory
                            value: src/Routine/.*
                    must_not:
                        -   type: directory
                            value: src/[^/]+/Domain/Event/.*
        -   name: Inbox
            collectors:
                -   type: bool
                    must:
                        -   type: directory
                            value: src/Inbox/.*
                    must_not:
                        -   type: directory
                            value: src/[^/]+/Domain/Event/.*
        -   name: Assistant
            collectors:
                -   type: bool
                    must:
                        -   type: directory
                            value: src/Assistant/.*
                    must_not:
                        -   type: directory
                            value: src/[^/]+/Domain/Event/.*
        -   name: Billing
            collectors:
                -   type: bool
                    must:
                        -   type: directory
                            value: src/Billing/.*
                    must_not:
                        -   type: directory
                            value: src/[^/]+/Domain/Event/.*
        -   name: Privacy
            collectors:
                -   type: bool
                    must:
                        -   type: directory
                            value: src/Privacy/.*
                    must_not:
                        -   type: directory
                            value: src/[^/]+/Domain/Event/.*
        # Les jeux de données de démonstration traversent les contextes par
        # nature : semer un carnet suppose un compte, une organisation, des
        # notes et des listes. Ce n'est pas du code de production, et
        # l'exception est nominative — un seul fichier, nommé ici.
        -   name: DevFixtures
            collectors:
                -   type: classNameRegex
                    value: '#^App\\Shared\\UI\\Console\\SeedDemoDataCommand$#'
        -   name: PublishedEvents
            collectors:
                -   type: directory
                    value: src/[^/]+/Domain/Event/.*
        -   name: Kernel
            collectors: [{ type: classNameRegex, value: '#^App\\Kernel$#' }]

    ruleset:
        Shared: [PublishedEvents]
        PublishedEvents: [Shared]
        Identity: [Shared, PublishedEvents]
        Organization: [Shared, PublishedEvents]
        Notebook: [Shared, PublishedEvents]
        Task: [Shared, PublishedEvents]
        Reminder: [Shared, PublishedEvents]
        Inbox: [Shared, PublishedEvents]
        Routine: [Shared, PublishedEvents]
        Assistant: [Shared, PublishedEvents]
        Billing: [Shared, PublishedEvents]
        Privacy: [Shared, PublishedEvents]
        DevFixtures:
            - Shared
            - PublishedEvents
            - Identity
            - Organization
            - Notebook
            - Task
            - Reminder
            - Inbox
            - Routine
            - Assistant
            - Privacy
        Kernel:
            - Shared
            - PublishedEvents
            - DevFixtures
            - Identity
            - Organization
            - Notebook
            - Task
            - Reminder
            - Inbox
            - Routine
            - Assistant
            - Billing
            - Privacy
