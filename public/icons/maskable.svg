<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <!-- Icône masquable : la marque tient dans la zone sûre centrale (80 %),
         le fond couvre toute la surface pour supporter n'importe quel gabarit. -->
    <rect width="512" height="512" fill="#eaeae8"/>
    <g transform="rotate(-38 256 256)">
        <clipPath id="pill-maskable">
            <rect x="214" y="154" width="84" height="204" rx="42"/>
        </clipPath>
        <g clip-path="url(#pill-maskable)">
            <rect x="214" y="154" width="84" height="102" fill="#1f1f1f"/>
            <rect x="214" y="256" width="84" height="102" fill="#dcdcd8"/>
        </g>
    </g>
</svg>
